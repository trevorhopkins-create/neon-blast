<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>NEON DROP — Derez the Targets</title>
<style>
html,body{margin:0;height:100%;background:#02030a;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
canvas{display:block}
#touch{position:fixed;left:0;right:0;bottom:10px;display:none;justify-content:center;gap:8px;z-index:2}
#touch button{width:58px;height:58px;border-radius:14px;border:2px solid #0ff;background:rgba(0,40,60,.55);color:#cff;font:bold 22px Arial,sans-serif;box-shadow:0 0 12px rgba(0,255,255,.5);touch-action:none}
</style></head><body>
<canvas id="c"></canvas>
<div id="touch"><button data-a="left">◀</button><button data-a="right">▶</button><button data-a="rotb">↺</button><button data-a="rot">↻</button><button data-a="down">▼</button><button data-a="drop">⤓</button><button data-a="pause">❚❚</button></div>
<script>
'use strict';
const Q = new URLSearchParams(location.search);
const COLS = 10, ROWS = 20;
const COLORS = [
  { name: 'RED',    hex: '#ff2a4d', glow: '#ff0033', rgb: [255, 42, 77],  sym: 'tri' },
  { name: 'ORANGE', hex: '#ff8a1f', glow: '#ff6a00', rgb: [255, 138, 31], sym: 'sq' },
  { name: 'YELLOW', hex: '#ffe83a', glow: '#ffd000', rgb: [255, 232, 58], sym: 'star' },
  { name: 'GREEN',  hex: '#3dff6e', glow: '#00ff44', rgb: [61, 255, 110], sym: 'plus' },
  { name: 'BLUE',   hex: '#2aa8ff', glow: '#0080ff', rgb: [42, 168, 255], sym: 'dia' },
  { name: 'PURPLE', hex: '#c04dff', glow: '#a000ff', rgb: [192, 77, 255], sym: 'ring' }];
const NC = COLORS.length;
window.__dropErrors = [];
window.addEventListener('error', e => window.__dropErrors.push(String(e.message)));

// ---------- RNG ----------
function mulberry(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
let rnd = mulberry(Q.has('seed') ? (+Q.get('seed') >>> 0) : (Math.random() * 4294967296) >>> 0);
const ri = n => Math.floor(rnd() * n);

// ---------- core logic (pure) ----------
const idx = (x, y) => y * COLS + x;
const newBoard = () => new Array(COLS * ROWS).fill(null);
const cloneBoard = b => b.map(c => c ? { c: c.c, t: c.t, fall: 0 } : null);

function findRuns(b) {
  const runs = [];
  for (let y = 0; y < ROWS; y++) {
    let x = 0;
    while (x < COLS) {
      const c = b[idx(x, y)]; if (!c) { x++; continue; }
      let e = x + 1; while (e < COLS && b[idx(e, y)] && b[idx(e, y)].c === c.c) e++;
      if (e - x >= 3) { const cells = []; for (let k = x; k < e; k++) cells.push(idx(k, y)); runs.push({ dir: 'h', color: c.c, cells }); }
      x = e;
    }
  }
  for (let x = 0; x < COLS; x++) {
    let y = 0;
    while (y < ROWS) {
      const c = b[idx(x, y)]; if (!c) { y++; continue; }
      let e = y + 1; while (e < ROWS && b[idx(x, e)] && b[idx(x, e)].c === c.c) e++;
      if (e - y >= 3) { const cells = []; for (let k = y; k < e; k++) cells.push(idx(x, k)); runs.push({ dir: 'v', color: c.c, cells }); }
      y = e;
    }
  }
  return runs;
}
// returns null or {clear:Set, runs, targets, longest}
function analyze(b) {
  const runs = findRuns(b);
  if (!runs.length) return null;
  const clear = new Set(); let longest = 0;
  for (const r of runs) { r.cells.forEach(c => clear.add(c)); longest = Math.max(longest, r.cells.length); }
  let targets = 0; for (const i of clear) if (b[i].t) targets++;
  return { clear, runs, targets, longest };
}
// targets are fixed in place; normal disks fall. Marks c.fall (rows fallen) for animation.
function gravity(b) {
  let moved = false;
  for (let x = 0; x < COLS; x++) {
    for (let y = ROWS - 2; y >= 0; y--) {
      const c = b[idx(x, y)]; if (!c || c.t) continue;
      let ny = y; while (ny + 1 < ROWS && !b[idx(x, ny + 1)]) ny++;
      if (ny !== y) { b[idx(x, ny)] = c; b[idx(x, y)] = null; c.fall = (c.fall || 0) + (ny - y); moved = true; }
    }
  }
  return moved;
}
function simResolve(b) {
  let chain = 0, cleared = 0, targets = 0, score = 0;
  for (;;) {
    gravity(b);
    const a = analyze(b); if (!a) break;
    chain++; cleared += a.clear.size; targets += a.targets;
    for (const i of a.clear) b[i] = null;
  }
  return { chain, cleared, targets };
}
const countTargets = b => b.reduce((n, c) => n + (c && c.t ? 1 : 0), 0);

// falling piece: pair. rot0: B right of A, rot1: B below, rot2: B left, rot3: B above
function pieceCells(p) {
  const o = [[0, 0], [1, 0], [0, 1], [-1, 0], [0, -1]][p.rot === 0 ? 1 : p.rot === 1 ? 2 : p.rot === 2 ? 3 : 4];
  return [{ x: p.x, y: p.y, c: p.colors[0] }, { x: p.x + o[0], y: p.y + o[1], c: p.colors[1] }];
}
function collides(b, p) {
  for (const c of pieceCells(p)) {
    if (c.x < 0 || c.x >= COLS || c.y >= ROWS) return true;
    if (c.y >= 0 && b[idx(c.x, c.y)]) return true;
  }
  return false;
}
function dropY(b, p) { const q = { ...p }; while (!collides(b, { ...q, y: q.y + 1 })) q.y++; return q.y; }
// place piece into board; returns false if any cell is above the top (top-out)
function placePiece(b, p) {
  let ok = true;
  for (const c of pieceCells(p)) { if (c.y < 0) { ok = false; continue; } b[idx(c.x, c.y)] = { c: c.c, t: false, fall: 0 }; }
  return ok;
}

// Level layout: N targets, fixed, in lower part, no pre-made 3-in-a-row
function makeLevel(level) {
  const b = newBoard();
  const n = level;
  const topRow = Math.max(5, 14 - Math.floor(level / 2)); // targets live in rows topRow..19
  let placed = 0, guard = 0;
  while (placed < n && guard++ < 5000) {
    const x = ri(COLS), y = topRow + ri(ROWS - topRow);
    if (b[idx(x, y)]) continue;
    // keep the spawn column area clear-ish and leave headroom
    const c = ri(NC);
    b[idx(x, y)] = { c, t: true, fall: 0 };
    if (findRuns(b).length) { b[idx(x, y)] = null; continue; }
    placed++;
  }
  return b;
}
// pieces: lean toward colors of remaining targets so levels stay winnable
function genPiece(b) {
  const tc = []; if (b) b.forEach(c => { if (c && c.t) tc.push(c.c); });
  const pick = () => (tc.length && rnd() < 0.45) ? tc[ri(tc.length)] : ri(NC);
  return { x: 4, y: 0, rot: 0, colors: [pick(), pick()] };
}

// ---------- bot ----------
function heights(b) {
  const h = [];
  for (let x = 0; x < COLS; x++) { let y = 0; while (y < ROWS && !b[idx(x, y)]) y++; h.push(ROWS - y); }
  return h;
}
function evalBoard(b, res) {
  let v = res.targets * 5000 + res.cleared * 30 + res.chain * 60;
  const h = heights(b); const maxH = Math.max(...h);
  v -= h.reduce((a, c) => a + c, 0) * 2;
  if (maxH > 11) v -= (maxH - 11) ** 2 * 60;
  if (maxH >= 17) v -= 20000;
  // potential: same-colour contiguous neighbours, more if a target is involved
  for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
    const c = b[idx(x, y)]; if (!c) continue;
    const r = x + 1 < COLS ? b[idx(x + 1, y)] : null, d = y + 1 < ROWS ? b[idx(x, y + 1)] : null;
    if (r && r.c === c.c) v += (c.t || r.t) ? 120 : 8;
    if (d && d.c === c.c) v += (c.t || d.t) ? 120 : 8;
    // a normal disk of a different colour sitting directly on a target buries it
    if (d && d.t && !c.t && d.c !== c.c) v -= 90;
    if (r && r.t && !c.t && r.c !== c.c) v -= 25;
    if (c.t) { // open air above a target is good
      if (y > 0 && !b[idx(x, y - 1)]) v += 15;
    }
  }
  return v;
}
function botPlan(b, piece, maxTargets) {
  let best = null;
  for (let rot = 0; rot < 4; rot++) for (let x = -1; x <= COLS; x++) {
    const p = { x, y: piece.y, rot, colors: piece.colors };
    if (collides(b, p)) continue;
    p.y = dropY(b, p);
    const bb = cloneBoard(b);
    if (!placePiece(bb, p)) continue;
    const res = simResolve(bb);
    const v = evalBoard(bb, res) + Math.random() * 0.5;
    if (!best || v > best.v) best = { v, x, rot };
  }
  return best;
}

// ---------- audio ----------
let AC = null, muted = Q.get('mute') === '1';
function ac() { if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; } } return AC; }
function tone(f, d, type = 'square', vol = 0.08, slide = 0) {
  if (muted) return; const a = ac(); if (!a) return;
  try {
    const o = a.createOscillator(), g = a.createGain(); o.type = type; o.frequency.setValueAtTime(f, a.currentTime);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(20, f + slide), a.currentTime + d);
    g.gain.setValueAtTime(vol, a.currentTime); g.gain.exponentialRampToValueAtTime(0.0001, a.currentTime + d);
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + d + 0.02);
  } catch (e) {}
}
const sfx = {
  move: () => tone(330, 0.04, 'square', 0.03),
  rot: () => tone(520, 0.05, 'triangle', 0.05),
  lock: () => tone(140, 0.08, 'sine', 0.1, -60),
  derez: ch => { tone(700 + ch * 120, 0.25, 'sawtooth', 0.06, -500); setTimeout(() => tone(1100 + ch * 150, 0.15, 'square', 0.04, 600), 60); },
  target: () => { tone(880, 0.12, 'triangle', 0.08); setTimeout(() => tone(1320, 0.18, 'triangle', 0.08), 90); },
  level: () => [523, 659, 784, 1046].forEach((f, i) => setTimeout(() => tone(f, 0.22, 'triangle', 0.09), i * 110)),
  over: () => [400, 300, 200, 120].forEach((f, i) => setTimeout(() => tone(f, 0.3, 'sawtooth', 0.07), i * 160)),
};

// ---------- game state ----------
const G = {
  state: 'title', board: newBoard(), piece: null, next: null, level: 1, score: 0,
  phase: 'piece', gravT: 0, lockT: 0, lockResets: 0, chain: 0, flashT: 0, pending: null, msgT: 0,
  targetsTotal: 0, pieces: 0, levelsCleared: 0, botT: 0, botTarget: null, scenarioT: -1,
  best: { score: 0, level: 0 }, autopilot: Q.get('autopilot') === '1',
};
try { const s = JSON.parse(localStorage.getItem('neonDropBest') || 'null'); if (s) G.best = s; } catch (e) {}
function saveBest() {
  G.best.score = Math.max(G.best.score, G.score); G.best.level = Math.max(G.best.level, G.level);
  try { localStorage.setItem('neonDropBest', JSON.stringify(G.best)); } catch (e) {}
}
const dropInterval = lv => Math.max(0.12, 0.85 * Math.pow(0.92, lv - 1));
const LOCK_DELAY = 0.45, DAS = 0.16, ARR = 0.05;
const held = { left: false, right: false, down: false }, das = { left: 0, right: 0 };

const particles = [], derez = [], popups = [], rings = [];
let shake = 0;

function startGame(level) {
  G.score = 0; G.levelsCleared = 0; G.pieces = 0;
  startLevel(level || +(Q.get('level') || 1));
  G.state = 'play';
}
function startLevel(lv) {
  G.level = lv; G.board = makeLevel(lv); G.targetsTotal = countTargets(G.board);
  G.dropInt = dropInterval(lv); G.chain = 0;
  G.next = genPiece(G.board); spawn();
  popup('LEVEL ' + lv, COLS / 2, 7, '#7ff', 1.6, 2.2);
  popup(G.targetsTotal + (G.targetsTotal === 1 ? ' TARGET' : ' TARGETS') + ' TO DEREZ', COLS / 2, 8.6, '#fff', 0.8, 2.2);
}
function spawn() {
  G.piece = G.next; G.piece.x = 4; G.piece.y = 0; G.piece.rot = 0;
  G.next = genPiece(G.board);
  G.gravT = 0; G.lockT = 0; G.lockResets = 0; G.phase = 'piece'; G.botTarget = null; G.botSteps = 0;
  if (collides(G.board, G.piece)) { gameOver(); return; }
  if (G.autopilot) { G.botTarget = botPlan(G.board, G.piece); G.botT = botDelay(); }
}
function gameOver() { G.state = 'over'; G.phase = 'over'; saveBest(); sfx.over(); shake = 12; }

function tryMove(dx, dy) {
  const p = G.piece; if (!p || G.phase !== 'piece') return false;
  const q = { ...p, x: p.x + dx, y: p.y + dy };
  if (collides(G.board, q)) return false;
  p.x = q.x; p.y = q.y; resetLock(); if (dx) sfx.move(); return true;
}
function tryRotate(dir) {
  const p = G.piece; if (!p || G.phase !== 'piece') return false;
  const rot = (p.rot + (dir > 0 ? 1 : 3)) % 4;
  for (const [kx, ky] of [[0, 0], [-1, 0], [1, 0], [0, -1]]) {
    const q = { ...p, rot, x: p.x + kx, y: p.y + ky };
    if (!collides(G.board, q)) { p.rot = rot; p.x = q.x; p.y = q.y; resetLock(); sfx.rot(); return true; }
  }
  return false;
}
function resetLock() { if (G.lockT > 0 && G.lockResets < 15) { G.lockT = 0; G.lockResets++; } }
function hardDrop() {
  const p = G.piece; if (!p || G.phase !== 'piece') return;
  const ny = dropY(G.board, p); G.score += (ny - p.y) * 2; p.y = ny; lockPiece();
}
function lockPiece() {
  const p = G.piece; G.piece = null; G.pieces++;
  if (!placePiece(G.board, p)) { placePiece(G.board, p); gameOver(); return; }
  sfx.lock(); G.chain = 0;
  gravity(G.board); G.phase = 'settle';
}
function doCheck() {
  const a = analyze(G.board);
  if (a) {
    G.chain++; G.pending = a; G.phase = 'flash'; G.flashT = 0.22;
    return;
  }
  if (countTargets(G.board) === 0) { levelComplete(); return; }
  spawn();
}
function applyClear() {
  const a = G.pending; G.pending = null;
  let sx = 0, sy = 0;
  for (const i of a.clear) {
    const c = G.board[i], x = i % COLS, y = (i / COLS) | 0; sx += x; sy += y;
    startDerez(x, y, c.c, c.t);
    G.board[i] = null;
  }
  const n = a.clear.size, cx = sx / n, cy = Math.min(sy / n, ROWS - 1.5);
  const bonus = a.longest >= 4 ? (a.longest - 3) * 50 : 0;
  const pts = (n * 10 + a.targets * 100 + bonus) * G.chain * G.level;
  G.score += pts;
  sfx.derez(G.chain); if (a.targets) sfx.target();
  shake = Math.min(14, shake + 3 + a.targets * 2 + G.chain);
  popup('+' + pts, cx, cy - 1, '#fff', 0.7, 1.1);
  if (G.chain > 1) popup('CHAIN x' + G.chain, cx, cy - 4.6, '#ff5cf7', 1.0, 1.3);
  if (a.targets) popup(a.targets > 1 ? a.targets + ' TARGETS DEREZZED' : 'TARGET DEREZZED', cx, cy - 2.2, '#7ff', 0.75, 1.3);
  if (a.longest >= 4) popup(a.longest + ' IN A ROW!', cx, cy - 3.4, '#ffe83a', 0.8, 1.2);
  G.phase = 'derez'; G.flashT = 0.38;
}
function levelComplete() {
  G.levelsCleared++;
  const bonus = 500 * G.level; G.score += bonus; saveBest(); sfx.level();
  G.phase = 'levelup'; G.msgT = 2.4; G.levelBonus = bonus;
  rings.push({ x: COLS / 2, y: ROWS / 2, r: 0, max: 14, t: 0, life: 1.0, col: '#0ff' });
}

// ---------- effects ----------
function popup(text, x, y, col, size, life) { popups.push({ text, x, y, col, size, life, t: 0 }); }
function startDerez(x, y, c, isTarget) {
  derez.push({ x, y, c, t: 0, life: 0.9, target: isTarget, seed: Math.random() * 1000 });
  const col = COLORS[c].rgb, n = isTarget ? 34 : 18;
  for (let k = 0; k < n; k++) {
    if (particles.length > 2500) break;
    // voxel fragments: lift off on a grid, drift up and sideways like de-resolution
    const gx = (k % 5) / 4 - 0.5, gy = Math.floor(k / 5) % 5 / 4 - 0.5;
    particles.push({
      x: x + 0.5 + gx * 0.7, y: y + 0.5 + gy * 0.7, vx: gx * 1.6 + (Math.random() - 0.5) * 1.8, vy: -2 - Math.random() * 4.5,
      life: 0.6 + Math.random() * 0.9, t: -Math.random() * 0.25, col, sz: 0.11 + Math.random() * 0.14, flick: Math.random() * 10,
    });
  }
  if (isTarget) rings.push({ x: x + 0.5, y: y + 0.5, r: 0, max: 2.6, t: 0, life: 0.6, col: COLORS[c].hex });
}

// ---------- update ----------
function botDelay() { return +(Q.get('botdelay') || 0.07); }
function botStep() {
  const p = G.piece, tg = G.botTarget; if (!p) return;
  if (!tg || ++G.botSteps > 25) { hardDrop(); return; }
  if (p.rot !== tg.rot) { if (!tryRotate(1)) { G.botTarget = null; } return; }
  if (p.x < tg.x) { if (!tryMove(1, 0)) G.botTarget = null; return; }
  if (p.x > tg.x) { if (!tryMove(-1, 0)) G.botTarget = null; return; }
  hardDrop();
}
function update(dt) {
  for (const p of particles) { p.t += dt; if (p.t > 0) { p.x += p.vx * dt; p.y += p.vy * dt; p.vy -= 0.6 * dt; p.vx *= 0.98; } }
  for (let i = particles.length - 1; i >= 0; i--) if (particles[i].t > particles[i].life) particles.splice(i, 1);
  for (const d of derez) d.t += dt; for (let i = derez.length - 1; i >= 0; i--) if (derez[i].t > derez[i].life) derez.splice(i, 1);
  for (const p of popups) { p.t += dt; p.y -= dt * 0.6; } for (let i = popups.length - 1; i >= 0; i--) if (popups[i].t > popups[i].life) popups.splice(i, 1);
  for (const r of rings) { r.t += dt; r.r = r.max * Math.min(1, r.t / r.life); } for (let i = rings.length - 1; i >= 0; i--) if (rings[i].t > rings[i].life) rings.splice(i, 1);
  shake = Math.max(0, shake - dt * 30);
  titleT += dt;
  if (G.state !== 'play' || G.paused) return;
  if (G.phase === 'piece') {
    const p = G.piece;
    if (G.scenarioT > 0) { G.scenarioT -= dt; if (G.scenarioT <= 0) { hardDrop(); } return; }
    for (const k of ['left', 'right']) if (held[k]) { das[k] += dt; while (das[k] >= DAS) { das[k] -= ARR; tryMove(k === 'left' ? -1 : 1, 0); } }
    if (G.autopilot) { G.botT -= dt; if (G.botT <= 0) { G.botT = botDelay(); botStep(); if (G.phase !== 'piece') return; } }
    if (!G.piece) return;
    const grounded = collides(G.board, { ...p, y: p.y + 1 });
    const interval = held.down ? Math.min(0.035, G.dropInt) : G.dropInt;
    if (!grounded) {
      G.lockT = 0; G.gravT += dt;
      while (G.gravT >= interval) { G.gravT -= interval; if (collides(G.board, { ...p, y: p.y + 1 })) break; p.y++; if (held.down) G.score++; }
    } else { G.gravT = 0; G.lockT += dt * (held.down ? 3 : 1); if (G.lockT >= LOCK_DELAY) lockPiece(); }
  } else if (G.phase === 'settle') {
    let any = false;
    for (const c of G.board) if (c && c.fall > 0) { c.fall = Math.max(0, c.fall - dt * 22); any = true; }
    if (!any) doCheck();
  } else if (G.phase === 'flash') {
    G.flashT -= dt; if (G.flashT <= 0) applyClear();
  } else if (G.phase === 'derez') {
    G.flashT -= dt; if (G.flashT <= 0) { gravity(G.board); G.phase = 'settle'; }
  } else if (G.phase === 'levelup') {
    G.msgT -= dt; if (G.msgT <= 0) startLevel(G.level + 1);
  }
}

// ---------- rendering ----------
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
let W = 0, H = 0, DPR = 1, CS = 30, BX = 0, BY = 0, layout = 'wide', sprites = [], targetSprites = [];
let titleT = 0;
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2); W = innerWidth; H = innerHeight;
  cv.width = W * DPR; cv.height = H * DPR; cv.style.width = W + 'px'; cv.style.height = H + 'px';
  const touchPad = touchOn ? 90 : 0;
  if (W >= H * 0.95) { layout = 'wide'; CS = Math.floor(Math.min((H - 40 - touchPad) / ROWS, (W - 40) / (COLS + 13))); BX = Math.round((W - COLS * CS) / 2); }
  else { layout = 'tall'; CS = Math.floor(Math.min((H - 60 - touchPad) / ROWS, (W - 20) / (COLS + 4.6))); BX = 10 + Math.round((W - 20 - (COLS + 4.6) * CS) / 2); }
  CS = Math.max(10, CS);
  BY = Math.round((H - touchPad - ROWS * CS) / 2) + (layout === 'tall' ? 10 : 0);
  buildSprites();
}
function symPath(g, sym, r) {
  g.beginPath();
  if (sym === 'tri') { g.moveTo(0, -r); g.lineTo(r * 0.9, r * 0.6); g.lineTo(-r * 0.9, r * 0.6); g.closePath(); }
  else if (sym === 'sq') g.rect(-r * 0.7, -r * 0.7, r * 1.4, r * 1.4);

  if (k === 'ArrowDown' || k === 's' || k === 'S') held.down = false;

cv.addEventListener('pointerdown', () => { if (G.state !== 'play') startOrRestart(); });
addEventListener('blur', () => { held.left = held.right = held.down = false; });
if (touchOn) {
  const bar = document.getElementById('touch'); bar.style.display = 'flex';
  const acts = { left: () => { held.left = true; das.left = 0; tryMove(-1, 0); }, right: () => { held.right = true; das.right = 0; tryMove(1, 0); }, rot: () => tryRotate(1), rotb: () => tryRotate(-1), down: () => { held.down = true; }, drop: () => hardDrop(), pause: () => { G.paused = !G.paused; } };
  bar.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('pointerdown', e => { e.preventDefault(); if (G.state !== 'play') { startOrRestart(); return; } G.scenarioT = -1; acts[btn.dataset.a](); });
    const up = () => { if (btn.dataset.a === 'left') held.left = false; if (btn.dataset.a === 'right') held.right = false; if (btn.dataset.a === 'down') held.down = false; };
    btn.addEventListener('pointerup', up); btn.addEventListener('pointerleave', up); btn.addEventListener('pointercancel', up);
  });
}
addEventListener('resize', resize);

// ---------- scenario (for screenshots / demo) ----------
function loadScenario(name) {
  if (name !== 'derez') return;
  startGame(3);
  const b = newBoard(), put = (x, y, c, t) => { b[idx(x, y)] = { c, t: !!t, fall: 0 }; };
  for (let y = 16; y < ROWS; y++) for (let x = 0; x < COLS; x++) put(x, y, (x + 2 * y) % NC, y === 19 && (x === 2 || x === 7));
  // row 15: two red targets with a gap for the falling red disk -> 5 in a row
  put(0, 15, 3); put(1, 15, 0, 1); put(2, 15, 0); put(4, 15, 0); put(5, 15, 0, 1); put(6, 15, 2); put(7, 15, 5); put(9, 15, 4);
  put(0, 14, 5); put(2, 14, 4); put(6, 14, 1); put(9, 14, 2);
  put(8, 9, 2, 1); put(1, 8, 4, 1);
  G.board = b; G.targetsTotal = countTargets(b); popups.length = 0;
  // vertical pair (red on the bottom) dropping into column 3
  G.piece = { x: 3, y: 0, rot: 3, colors: [0, 4] }; G.next = { x: 4, y: 0, rot: 0, colors: [2, 5] };
  G.scenarioT = +(Q.get('dropat') || 1.0);
}

// ---------- tests ----------
function runTests() {
  const R = [];
  const ok = (name, cond, info) => R.push({ name, pass: !!cond, info: info === undefined ? '' : info });
  const B = () => newBoard(), put = (b, x, y, c, t) => { b[idx(x, y)] = { c, t: !!t, fall: 0 }; };
  let b = B(); put(b, 0, 19, 0); put(b, 1, 19, 0); ok('2 in a row: no match', !analyze(b));
  put(b, 2, 19, 0); let a = analyze(b); ok('3 horizontal clears 3', a && a.clear.size === 3);
  b = B(); for (let y = 15; y < 19; y++) put(b, 5, y, 2); put(b, 5, 19, 3); a = analyze(b); ok('4 vertical clears 4', a && a.clear.size === 4 && a.longest === 4);
  b = B(); put(b, 3, 19, 1, 1); put(b, 4, 19, 1); put(b, 5, 19, 1); a = analyze(b); ok('match including target counts target', a && a.targets === 1);
  b = B(); put(b, 3, 19, 1); put(b, 4, 19, 2); put(b, 5, 19, 1); ok('mixed colors: no match', !analyze(b));
  b = B(); put(b, 2, 10, 3, 1); put(b, 2, 3, 4); gravity(b); ok('targets stay fixed, normal disks fall onto them', b[idx(2, 10)] && b[idx(2, 10)].t && b[idx(2, 9)] && b[idx(2, 9)].c === 4);
  b = B(); put(b, 0, 19, 5); put(b, 1, 19, 0); put(b, 2, 19, 0); put(b, 0, 18, 0); put(b, 0, 17, 1); put(b, 0, 16, 1);
  // drop red onto col 3 -> clears 3 reds; nothing else
  let p = { x: 3, y: 0, rot: 1, colors: [1, 0] }; p.y = dropY(b, p); placePiece(b, p);
  let r = simResolve(b); ok('pair placement + resolve clears row', r.cleared === 3 && r.chain === 1, JSON.stringify(r));
  // chain: after first clear, a disk falls and makes a second match
  b = B(); put(b, 0, 19, 1); put(b, 1, 19, 1); put(b, 2, 19, 0); put(b, 2, 18, 1); put(b, 3, 19, 0); put(b, 4, 19, 2);
  put(b, 4, 18, 0);
  r = simResolve(b); ok('no false chain', r.cleared === 0);
  b = B(); put(b, 0, 19, 0); put(b, 1, 19, 0); put(b, 2, 19, 3); put(b, 3, 19, 3); put(b, 2, 18, 0); put(b, 4, 19, 3);
  r = simResolve(b); ok('chain reaction (x2)', r.chain === 2 && r.cleared === 6, JSON.stringify(r));
  let lvOk = true, info = '';
  for (let lv = 1; lv <= 30; lv++) { const lb = makeLevel(lv); const n = countTargets(lb); if (n !== lv || findRuns(lb).length) { lvOk = false; info = 'lv' + lv + ' n=' + n; } }
  ok('levels 1..30 have exactly N targets and no pre-made matches', lvOk, info);
  b = makeLevel(1); ok('level 1 has 1 target', countTargets(b) === 1);
  return R;
}
// fast headless bot simulation: returns levels cleared
function simBot(maxPieces, startLv) {
  let lv = startLv || 1, b = makeLevel(lv), pieces = 0, cleared = 0, log = [];
  let piece = genPiece(b);
  while (pieces < maxPieces) {
    piece.x = 4; piece.y = 0; piece.rot = 0;
    if (collides(b, piece)) { log.push('topout@' + lv); break; }
    const best = botPlan(b, piece); if (!best) { log.push('noplan@' + lv); break; }
    const p = { ...piece, x: best.x, rot: best.rot }; p.y = dropY(b, p);
    if (!placePiece(b, p)) { log.push('topout2@' + lv); break; }
    simResolve(b); pieces++;
    if (countTargets(b) === 0) { cleared++; log.push('L' + lv + ':' + pieces); lv++; b = makeLevel(lv); }
    piece = genPiece(b);
  }
  return { cleared, reached: lv, pieces, log: log.join(' ') };
}
window.__drop = { G, analyze, gravity, simResolve, makeLevel, botPlan, runTests, simBot, countTargets, startGame, startLevel };
if (Q.get('test') === '1') { window.__dropTests = runTests(); console.log('TESTS', JSON.stringify(window.__dropTests)); }

resize();
if (Q.get('scenario')) loadScenario(Q.get('scenario'));
else if (G.autopilot || Q.has('level')) startGame();
requestAnimationFrame(frame);
