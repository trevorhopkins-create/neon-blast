    /* ---- sleek light-cycle built from primitives ---- */
    function makeBike(colorHex) {
      var color = new THREE.Color(colorHex);
      var mats = [];
      function M(m) { m.transparent = true; mats.push(m); return m; }
      var outer = new THREE.Group();
      var inner = new THREE.Group();   // lean happens here
      outer.add(inner);
      var body = new THREE.Group();
      body.position.x = 0.35;         // trail leaves from just behind the rear wheel
      inner.add(body);

      var shell = new THREE.Shape();
      shell.moveTo(-1.0, 0.16);
      shell.lineTo(-1.02, 0.46);
      shell.quadraticCurveTo(-0.85, 0.68, -0.45, 0.66);
      shell.lineTo(0.05, 0.56);
      shell.quadraticCurveTo(0.6, 0.55, 1.02, 0.28);
      shell.lineTo(0.98, 0.14);
      shell.lineTo(0.62, 0.1);
      shell.lineTo(-0.62, 0.1);
      shell.closePath();
      var shellGeo = new THREE.ExtrudeGeometry(shell, { depth: 0.2, bevelEnabled: true, bevelThickness: 0.035, bevelSize: 0.03, bevelSegments: 2, curveSegments: 10 });
      shellGeo.translate(0, 0, -0.1);
      var shellMat = M(new THREE.MeshStandardMaterial({ color: 0x0a0e18, metalness: 0.85, roughness: 0.28, emissive: color, emissiveIntensity: 0.06 }));
      body.add(new THREE.Mesh(shellGeo, shellMat));
      var edges = new THREE.LineSegments(new THREE.EdgesGeometry(shellGeo, 25), M(new THREE.LineBasicMaterial({ color: color.clone().multiplyScalar(0.95) })));
      body.add(edges);
      // side light strips
      var stripMat = M(new THREE.MeshBasicMaterial({ color: color.clone().multiplyScalar(1.5) }));
      [-1, 1].forEach(function (side) {
        var strip = new THREE.Mesh(new THREE.BoxGeometry(1.45, 0.035, 0.02), stripMat);
        strip.position.set(0.02, 0.36, side * 0.145); body.add(strip);
        var strip2 = new THREE.Mesh(new THREE.BoxGeometry(0.7, 0.025, 0.02), stripMat);
        strip2.position.set(-0.45, 0.5, side * 0.14); strip2.rotation.z = 0.12; body.add(strip2);
      });
      // canopy
      var canopy = new THREE.Mesh(new THREE.SphereGeometry(0.5, 24, 14), M(new THREE.MeshStandardMaterial({
        color: 0x0c1830, metalness: 0.3, roughness: 0.05, emissive: color, emissiveIntensity: 0.12, opacity: 0.9 })));
      canopy.scale.set(0.5, 0.14, 0.13); canopy.position.set(-0.1, 0.62, 0); body.add(canopy);
      // wheels: twin glowing rings with dark hubs
      var ringMat = M(new THREE.MeshBasicMaterial({ color: color.clone().multiplyScalar(1.15) }));
      var hubMat = M(new THREE.MeshStandardMaterial({ color: 0x05070c, metalness: 0.9, roughness: 0.35 }));
      var capMat = M(new THREE.MeshBasicMaterial({ color: color.clone().multiplyScalar(0.8) }));
      var ringGeo = new THREE.TorusGeometry(0.3, 0.05, 10, 40);
      var hubGeo = new THREE.CylinderGeometry(0.25, 0.25, 0.3, 28); hubGeo.rotateX(Math.PI / 2);
      var capGeo = new THREE.CylinderGeometry(0.07, 0.07, 0.34, 16); capGeo.rotateX(Math.PI / 2);
      var wheels = [];
      [-0.62, 0.62].forEach(function (wx) {
        var wg = new THREE.Group(); wg.position.set(wx, 0.3, 0);
        [-0.14, 0.14].forEach(function (wz) { var r = new THREE.Mesh(ringGeo, ringMat); r.position.z = wz; wg.add(r); });
        wg.add(new THREE.Mesh(hubGeo, hubMat));
        wg.add(new THREE.Mesh(capGeo, capMat));
        for (var k = 0; k < 3; k++) { var spoke = new THREE.Mesh(new THREE.BoxGeometry(0.42, 0.03, 0.31), capMat); spoke.rotation.z = k * Math.PI / 3; wg.add(spoke); }
        body.add(wg); wheels.push(wg);
      });
      // head & tail lights
      var head = new THREE.Mesh(new THREE.SphereGeometry(0.05, 10, 8), M(new THREE.MeshBasicMaterial({ color: new THREE.Color(3, 3, 3) })));
      head.position.set(1.0, 0.24, 0); body.add(head);
      var tail = new THREE.Mesh(new THREE.BoxGeometry(0.04, 0.12, 0.22), stripMat);
      tail.position.set(-1.03, 0.36, 0); body.add(tail);
      // under-glow on the floor
      var glow = new THREE.Mesh(new THREE.PlaneGeometry(2.4, 1.0), M(new THREE.MeshBasicMaterial({ map: R3.glowTex, color: color.clone().multiplyScalar(0.3),
        blending: THREE.AdditiveBlending, depthWrite: false })));
      glow.rotation.x = -Math.PI / 2; glow.position.set(0.35, 0.03, 0); outer.add(glow);
      outer.scale.setScalar(BIKE_SCALE);
      return { group: outer, inner: inner, wheels: wheels, mats: mats, baseOpacity: mats.map(function (m) { return m.opacity; }) };
    }

    function makeTrail(colorHex) {
      var color = new THREE.Color(colorHex);
      var cap = cycles.lifeTicks + 8;
      var wallMat = new THREE.MeshBasicMaterial({ color: color.clone().multiplyScalar(0.42), transparent: true, opacity: 0.55,
        blending: THREE.AdditiveBlending, depthWrite: false, side: THREE.DoubleSide });
      var wall = new THREE.InstancedMesh(R3.unitBox, wallMat, cap);
      var edgeMat = new THREE.MeshBasicMaterial({ color: color.clone().multiplyScalar(1.6), transparent: true, blending: THREE.AdditiveBlending, depthWrite: false });
      var edge = new THREE.InstancedMesh(R3.edgeBox, edgeMat, cap);
      var c = new THREE.Color(1, 1, 1);
      for (var i = 0; i < cap; i++) { wall.setColorAt(i, c); edge.setColorAt(i, c); }
      wall.count = 0; edge.count = 0;
      wall.frustumCulled = false; edge.frustumCulled = false;
      wall.renderOrder = 2; edge.renderOrder = 3;
      R3.scene.add(wall); R3.scene.add(edge);
      return { wall: wall, edge: edge, cap: cap };
    }

    function clearCycles3D() {
      if (!R3) return;
      R3.riders.forEach(function (v) {
        R3.scene.remove(v.bike.group); R3.scene.remove(v.trail.wall); R3.scene.remove(v.trail.edge);
        v.trail.wall.dispose(); v.trail.edge.dispose();
      });
      R3.riders = [];
      R3.fx.forEach(function (f) { R3.scene.remove(f.obj); });
      R3.fx = [];
    }

    function buildRiders3D() {
      if (!R3) init3D();
      clearCycles3D();
      cycles.riders.forEach(function (r) {
        var v = { bike: makeBike(r.color), trail: makeTrail(r.color) };
        r.view = v;
        r.yaw = dirYaw(r.dir);
        v.bike.group.position.set(gx(r.x), 0, gz(r.y));
        R3.scene.add(v.bike.group);
        R3.riders.push(v);
      });
      var p1 = cycles.riders[0];
      if (p1) snapCamera(p1);
    }

    function explode3D(r) {
      if (!R3 || !r.view) return;
      var a = interpAlpha();
      var px = gx(r.px + (r.x - r.px) * a), pz = gz(r.py + (r.y - r.py) * a);
      var color = new THREE.Color(r.color).multiplyScalar(2.2);
      var mat = new THREE.MeshBasicMaterial({ color: color, transparent: true });
      var group = new THREE.Group();
      var shards = [];
      for (var i = 0; i < 46; i++) {
        var m = new THREE.Mesh(R3.shardGeo, mat);
        m.position.set(px, 0.5, pz);
        m.scale.setScalar(0.5 + Math.random() * 1.4);
        var ang = Math.random() * Math.PI * 2, sp = 3 + Math.random() * 7;
        shards.push({ m: m, vx: Math.cos(ang) * sp, vy: 3 + Math.random() * 8, vz: Math.sin(ang) * sp, rx: Math.random() * 10, ry: Math.random() * 10 });
        group.add(m);
      }
      var flash = new THREE.Mesh(new THREE.SphereGeometry(0.6, 16, 12), new THREE.MeshBasicMaterial({ color: color.clone().multiplyScalar(1.5), transparent: true,
        blending: THREE.AdditiveBlending, depthWrite: false }));
      flash.position.set(px, 0.6, pz);
      group.add(flash);
      R3.scene.add(group);
      R3.fx.push({ obj: group, shards: shards, flash: flash, mat: mat, t: 0 });
      r.view.bike.group.visible = false;
      var p1 = cycles.riders[0];
      var d = Math.hypot(gx(p1.x) - px, gz(p1.y) - pz);
      R3.shake = Math.max(R3.shake, r === p1 ? 0.9 : Math.max(0.15, 0.6 - d / 60));
    }

    function updateFx(dt) {
      for (var i = R3.fx.length - 1; i >= 0; i--) {
        var f = R3.fx[i];
        f.t += dt;
        f.shards.forEach(function (s) {
          s.vy -= 16 * dt;
          s.m.position.x += s.vx * dt; s.m.position.y += s.vy * dt; s.m.position.z += s.vz * dt;
          if (s.m.position.y < 0.05) { s.m.position.y = 0.05; s.vy *= -0.35; s.vx *= 0.7; s.vz *= 0.7; }
          s.m.rotation.x += s.rx * dt; s.m.rotation.y += s.ry * dt;
        });
        f.flash.scale.setScalar(1 + f.t * 9);
        f.flash.material.opacity = Math.max(0, 1 - f.t * 3);
        f.mat.opacity = Math.max(0, 1 - Math.max(0, f.t - 0.9) / 0.8);
        if (f.t > 1.8) { R3.scene.remove(f.obj); R3.fx.splice(i, 1); }
      }
    }

    function angleDelta(a, b) { var d = b - a; while (d > Math.PI) d -= Math.PI * 2; while (d < -Math.PI) d += Math.PI * 2; return d; }

    function riderPos(r, a) { return { x: gx(r.px + (r.x - r.px) * a), z: gz(r.py + (r.y - r.py) * a) }; }

    function chaseTarget(r, out, look) {
      var a = interpAlpha(), p = riderPos(r, a);
      var fx = Math.cos(r.yaw), fz = -Math.sin(r.yaw);
      out.set(p.x - fx * 5.6 + fz * 1.6, 3.9, p.z - fz * 5.6 - fx * 1.6);
      look.set(p.x + fx * 6, 0.4, p.z + fz * 6);
    }
    function overheadTarget(out, look) {
      var cam = R3.camera, tanH = Math.tan(cam.fov * Math.PI / 360);
      var h = Math.max((ROWS / 2 + 8) / tanH, (COLS / 2 + 8) / (tanH * cam.aspect)) * 0.98;
      out.set(0, h, h * 0.32);
      look.set(0, 0, 3);
    }
    function snapCamera(r) {
      if (useOverhead()) overheadTarget(R3.camPos, R3.camLook); else chaseTarget(r, R3.camPos, R3.camLook);
    }

    var tmpPos = null, tmpLook = null;
    function render3D(dt) {
      if (!R3) return;
      R3.time += dt;
      var a = interpAlpha(), i, j;
      for (i = 0; i < cycles.riders.length; i++) {
        var r = cycles.riders[i], v = r.view;
        if (!v) continue;
        var bike = v.bike;
        if (r.alive) {
          var p = riderPos(r, a);
          var target = dirYaw(r.dir);
          var d = angleDelta(r.yaw, target);
          var step = d * Math.min(1, dt * 16);
          r.yaw += step;
          var yv = dt > 0 ? step / dt : 0;
          r.yawVel += (yv - r.yawVel) * Math.min(1, dt * 10);
          r.lean += (Math.max(-0.55, Math.min(0.55, -r.yawVel * 0.075)) - r.lean) * Math.min(1, dt * 9);
          bike.group.position.set(p.x, 0, p.z);
          bike.group.rotation.y = r.yaw;
          bike.inner.rotation.x = r.lean;
          bike.inner.position.y = Math.sin(R3.time * 9 + i) * 0.01;
          var spin = (cycles.phase === 'play' ? 1 : 0.15) * dt * (1000 / cycles.tickMs) / 0.3;
          for (j = 0; j < bike.wheels.length; j++) bike.wheels[j].rotation.z -= spin;
          var ghost = !r.trailOn;
          for (j = 0; j < bike.mats.length; j++) {
            bike.mats[j].opacity = ghost ? bike.baseOpacity[j] * (0.18 + (Math.random() < 0.25 ? 0.05 : 0.32) + 0.1 * Math.sin(R3.time * 40)) : bike.baseOpacity[j];
            bike.mats[j].depthWrite = !ghost;
          }
        }
        // trail ribbons with fade-out
        var tr = v.trail, n = 0, pcs = r.pieces;
        var nearFade = (i === 0 && !useOverhead() && r.alive) ? riderPos(r, a) : null;
        for (j = 0; j < pcs.length && n < tr.cap; j++) {
          var pc = pcs[j];
          var age = (tickNo - pc.b + a) / cycles.lifeTicks;
          if (age >= 1) continue;
          var len = (r.alive && pc.b === tickNo && j === pcs.length - 1) ? a : pc.len;
          var fade = age < 0.55 ? 1 : 1 - (age - 0.55) / 0.45;
          var hgt = TRAIL_H * (0.15 + 0.85 * Math.sqrt(fade));
          var dx = DIRS[pc.dir].x, dz = DIRS[pc.dir].y;
          var cx = gx(pc.x) + dx * len / 2, cz = gz(pc.y) + dz * len / 2;
          R3.q.setFromAxisAngle(R3.up, dirYaw(pc.dir));
          R3.v.set(cx, 0, cz);
          R3.sc.set(len + TRAIL_T, hgt, TRAIL_T);
          R3.m4.compose(R3.v, R3.q, R3.sc);
          tr.wall.setMatrixAt(n, R3.m4);
          R3.v.set(cx, hgt, cz);
          R3.sc.set(len + 0.1, 0.06, 0.1);
          R3.m4.compose(R3.v, R3.q, R3.sc);
          tr.edge.setMatrixAt(n, R3.m4);
          var bright = fade * (age < 0.04 ? 1.3 : 1);
          if (nearFade) {
            // in chase view, thin out the player's own wall right under the camera
            var ddx = cx - nearFade.x, ddz = cz - nearFade.z, dd = Math.sqrt(ddx * ddx + ddz * ddz);
            if (dd > 0.8) bright *= Math.max(0.06, 1 - (dd - 0.8) / 2.2);
          }
          R3.col.setRGB(bright, bright, bright);
          tr.wall.setColorAt(n, R3.col);
          tr.edge.setColorAt(n, R3.col);
          n++;
        }
        tr.wall.count = n; tr.edge.count = n;
        tr.wall.instanceMatrix.needsUpdate = true; tr.edge.instanceMatrix.needsUpdate = true;
        if (tr.wall.instanceColor) tr.wall.instanceColor.needsUpdate = true;
        if (tr.edge.instanceColor) tr.edge.instanceColor.needsUpdate = true;
      }
      updateFx(dt);

      // camera
      if (!tmpPos) { tmpPos = new THREE.Vector3(); tmpLook = new THREE.Vector3(); }
      var p1 = cycles.riders[0];
      if (useOverhead() || !p1) overheadTarget(tmpPos, tmpLook);
      else chaseTarget(p1, tmpPos, tmpLook);
      var k = 1 - Math.exp(-dt * (useOverhead() ? 3 : 6));
      R3.camPos.lerp(tmpPos, k);
      R3.camLook.lerp(tmpLook, 1 - Math.exp(-dt * 9));
      R3.camera.position.copy(R3.camPos);
      if (R3.shake > 0) {
        var s = R3.shake * R3.shake * 0.9;
        R3.camera.position.x += (Math.random() - 0.5) * s;
        R3.camera.position.y += (Math.random() - 0.5) * s;
        R3.camera.position.z += (Math.random() - 0.5) * s;
        R3.shake = Math.max(0, R3.shake - dt * 1.6);
      }
      R3.camera.lookAt(R3.camLook);
      R3.composer.render(dt);
    }

    /* ---------- main loop ---------- */
    function frame(ts) {
      var dt = lastTs ? Math.min(0.05, (ts - lastTs) / 1000) : 0.016;
      lastTs = ts;
      try {
        if (mode === 'menu') {
          drawSynthworld(dt, 0.55, COL.magenta);
        } else if (mode === 'cycles' || mode === 'cycles-go' || mode === 'cycles-over') {
          updateCycles(dt);
          if (THREE) render3D(dt); else renderCycles2D();
        } else if (mode === 'dodge' || mode === 'dodge-over') {
          if (mode === 'dodge') updateDodge(dt);
          else { dodge.shake = Math.max(0, dodge.shake - dt); dodge.flash = Math.max(0, dodge.flash - dt); }
          renderDodge(dt);
        }
        if (!(THREE && mode.indexOf('cycles') === 0)) { updateParticles(dt); drawParticles(); }
      } catch (err) {
        console.error(err);
      }
      requestAnimationFrame(frame);
    }

    /* ---------- boot ---------- */
    window.__tronErrors = [];
    window.addEventListener('error', function (e) { window.__tronErrors.push(String(e.message || e) + ' @' + e.lineno + ':' + e.colno); });
    window.addEventListener('unhandledrejection', function (e) { window.__tronErrors.push('rejection: ' + e.reason); });
    if (THREE) {
      try { init3D(); } catch (err) { console.warn('WebGL init failed, using 2D fallback', err); THREE = null; R3 = null; }
    }
    showMenu();
    var params = new URLSearchParams(location.search);
    if (params.get('diff') && DIFFS[params.get('diff')]) difficulty = params.get('diff');
    if (params.get('view') === 'overhead') viewMode = 'overhead';
    if (params.get('autopilot')) autopilot = true;
    if (params.get('dodgebot')) dodge.bot = true;
    var boot = params.get('autostart') || '';
    if (boot === 'cycles') startCycles(1);
    if (boot === 'cycles2') startCycles(2);
    if (boot === 'dodge') startDodge();
    window.__game = {
      get mode() { return mode; }, cycles: cycles, dodge: dodge, startCycles: startCycles, startDodge: startDodge,
      setDifficulty: setDifficulty, toggleView: toggleView, dodgeSim: dodgeSim, has3D: function () { return !!R3; },
      setAutopilot: function (v) { autopilot = !!v; }, setDodgeBot: function (v) { dodge.bot = !!v; }
    };
    requestAnimationFrame(frame);
  </script>
</body>
</html>
